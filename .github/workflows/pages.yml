name: Deploy Piper Bank to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'package.json', 'astro.config.mjs']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build site
        run: |
          npm ci
          SITE_BASE=/ npx astro build
          npx esbuild public/site.css --minify --outfile=dist/site.css
          mkdir -p dist/data
          cp src/data/models.json dist/data/models.json
          cp src/data/datasets.json dist/data/datasets.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
